<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        <div style="width: 428px; height: 500px; background-color: red; position: relative; overflow: hidden;">
            <div class="left" style="position: absolute; left: 0;top: 0; height: 100% ;width: 60px; background-color: #98fb982f; z-index: 1;"></div>
            <div class="center" style=" background-color: purple; height: 100%; position: relative; padding-left: 60px; padding-right: 60px; overflow-x: auto; width: 100%; display: flex;">
                <div style="width: 60px; height: 100%;"></div>
                <div style="min-width: 680px; background-color: pink; height: 100%;"></div>
                <div style="width: 60px; height: 100%;"></div>
            </div>
            <div class="right" style="position: absolute; right: 0; height: 100%; height: 100%; width: 60px; background-color: #98fb982f; top: 0; z-index: 1;"></div>
        </div>
    </div>
</body>
</html>
